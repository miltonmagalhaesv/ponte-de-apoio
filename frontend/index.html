function answer(question, plan){
 const q=question.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 if(/socorro|emergencia|soterr|nao consigo|nao atende/.test(q)) return 'Se precisar de socorro, toque em Bombeiros, 193. Para orientação, toque em Defesa Civil. Esta conversa não envia pedidos de resgate.';
 if(/onde estou|localizacao|partida/.test(q)) return 'Local de partida registrado: '+(plan.address || 'a combinar')+'. Sua posição atual pode ser diferente.';
 if(/onde|destino|ficar/.test(q)) return 'Destino no seu plano: '+(plan.dest || 'a combinar')+'. Confirme se podem receber você.';
 if(/quem|comigo|acompanha|contato/.test(q)) return (plan.who || 'Contato a combinar')+'. '+(plan.agreed?'Apoio confirmado no plano.':'Apoio ainda a confirmar.');
 return 'Posso consultar quem acompanha você, seu destino ou sua partida. Para pedir ajuda, os telefones estão abaixo.';
}

 talk.onclick=()=>{

function care(){screen.innerHTML='<h1>Cuidar do bairro</h1><article><h2>Antes da coleta</h2><p>Combine onde guardar os resíduos até a coleta. Sacos deixados na rua podem ser arrastados pela chuva e obstruir a drenagem.</p><a href="https://acaoinverno.recife.pe.gov.br/">Orientações da Prefeitura</a></article><button onclick="go(&quot;Avisos&quot;)">Voltar</button>'}
function capture(){screen.querySelectorAll('[name]').forEach(el=>{if(el.name==='help')d.help=[...screen.querySelectorAll('[name=help]:checked')].map(e=>e.value);else d[el.name]=el.type==='checkbox'?el.checked:el.value})}
function advance(dir){capture();i+=dir;if(i<0)go('Planos');else if(i===6){plans.push({...d});go('Planos');detail(plans.length-1)}else step()}
function hear(){if(!window.speechSynthesis){document.querySelector('#voice').textContent='Voz indisponível neste navegador.';return}const u=new SpeechSynthesisUtterance(steps[i]+'. '+document.querySelector('form').innerText);u.lang='pt-BR';speechSynthesis.cancel();speechSynthesis.speak(u)}
function step(){if(i===2 && !d.help && d.person?.trim().toLowerCase()==='eu')d.help=prefs.slice();screen.innerHTML='<p><small>Pergunta '+(i+1)+' de 6</small></p><progress value="'+(i+1)+'" max="6"></progress><h1>'+steps[i]+'</h1><button onclick="hear()">Ouvir pergunta</button><small id="voice"></small><form>'+fields[i]+'</form><button class="primary" onclick="advance(1)">'+(i===5?'Guardar combinado':'Continuar')+'</button><button onclick="advance(-1)">Voltar</button>';screen.querySelector('form').onsubmit=e=>{e.preventDefault();advance(1)};screen.querySelectorAll('[name]').forEach(el=>{if(el.type==='checkbox')el.checked=el.name==='help'?d.help?.includes(el.value):!!d.agreed;else if(d[el.name])el.value=d[el.name]})}go('Início');
if(typeof navigator !== 'undefined' && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

function applyAccess(){
 for(const [id,key] of [['fontToggle','large'],['contrastToggle','contrast']]){
 const button=document.getElementById(id);
 function set(on){document.body.classList.toggle(key,on);button.setAttribute('aria-pressed',String(on))}
 try{set(localStorage.getItem('ponte.'+key)==='1')}catch{}
 button.onclick=()=>{const on=button.getAttribute('aria-pressed')!=='true';set(on);try{localStorage.setItem('ponte.'+key,on?'1':'0')}catch{}
 document.querySelector('iframe')?.contentWindow?.applyAccess?.()};
 }}
if(typeof window!=='undefined')applyAccess();
</script></html>
