name: Verificar guia
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
      - run: node --input-type=module --check < frontend/app.js && node --check frontend/sw.js
      - name: Verificar arquivos privados no commit
        run: |
          if git ls-files | grep -Ei '(^|/)(sessao_|\.env($|\.)|creds\.json$)|\.(pem|key)$'; then exit 1; fi
