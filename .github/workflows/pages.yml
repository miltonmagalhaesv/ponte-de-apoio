name: Publicar guia
on:
  workflow_run:
    workflows: ["Verificar guia"]
    types: [completed]
    branches: [main]
permissions: {}
concurrency: publicar-guia
jobs:
  publicar:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - uses: actions/deploy-pages@v4
